<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Run &mdash; Set Sail with Containers</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="sky">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <main class="hero">
        <h1 class="title">Cloud Run</h1>
        <p class="subtitle">Ship your containers across the sea of infrastructure.</p>

        <div class="whale-scene">
            <svg class="whale" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A playful cartoon whale carrying shipping containers">
                <!-- body -->
                <path class="whale-body" d="M 30 140
                         C 30 90, 90 60, 160 62
                         C 230 64, 290 80, 330 110
                         C 350 125, 360 140, 355 150
                         C 340 160, 300 150, 260 148
                         C 200 145, 120 150, 70 155
                         C 45 158, 30 150, 30 140 Z" />

                <!-- tail -->
                <path class="whale-body" d="M 30 140 C 10 130, 0 115, 5 95 C 20 105, 30 118, 38 132 Z" />
                <path class="whale-body" d="M 30 148 C 8 155, -5 165, 0 182 C 18 172, 30 160, 40 150 Z" />

                <!-- belly -->
                <path class="whale-belly" d="M 70 155 C 120 168, 200 168, 260 156 C 240 172, 190 182, 150 180 C 110 178, 85 168, 70 155 Z" />

                <!-- fin -->
                <path class="whale-fin" d="M 150 150 C 155 168, 150 185, 135 195 C 138 175, 138 160, 140 148 Z" />

                <!-- spout water -->
                <g class="spout">
                    <circle cx="165" cy="30" r="4" />
                    <circle cx="172" cy="18" r="3" />
                    <circle cx="158" cy="20" r="2.5" />
                    <path d="M 165 55 C 160 45, 160 35, 165 30 C 170 35, 170 45, 165 55 Z" />
                </g>

                <!-- eye -->
                <circle class="whale-eye-white" cx="300" cy="105" r="9" />
                <circle class="whale-eye" cx="302" cy="106" r="4" />

                <!-- smile -->
                <path class="whale-smile" d="M 290 122 Q 305 132, 322 120" />

                <!-- containers on back -->
                <g class="containers">
                    <rect x="120" y="35" width="34" height="26" rx="2" class="container c-blue" />
                    <rect x="158" y="30" width="34" height="30" rx="2" class="container c-yellow" />
                    <rect x="196" y="35" width="34" height="26" rx="2" class="container c-green" />
                </g>
            </svg>

            <div class="waves">
                <svg viewBox="0 0 500 40" preserveAspectRatio="none" class="wave wave-back">
                    <path d="M0 20 Q 25 0 50 20 T 100 20 T 150 20 T 200 20 T 250 20 T 300 20 T 350 20 T 400 20 T 450 20 T 500 20 V40 H0 Z"/>
                </svg>
                <svg viewBox="0 0 500 40" preserveAspectRatio="none" class="wave wave-front">
                    <path d="M0 25 Q 25 5 50 25 T 100 25 T 150 25 T 200 25 T 250 25 T 300 25 T 350 25 T 400 25 T 450 25 T 500 25 V40 H0 Z"/>
                </svg>
            </div>
        </div>

        <a class="cta" href="https://www.docker.com" target="_blank" rel="noopener noreferrer">Get Started</a>
    </main>

    <footer class="footer">
        <p>Built with Python &amp; Flask &mdash; happy shipping! &#128051;</p>
    </footer>
</body>
</html>
