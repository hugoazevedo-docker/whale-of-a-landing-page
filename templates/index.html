<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Run &mdash; Set Sail with Containers</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="sky">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <main class="hero">
        <h1 class="title">Cloud Run</h1>
        <p class="subtitle">Ship your containers across the sea of infrastructure.</p>

        <div class="whale-scene">
            <svg class="whale" viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg"
                 role="img" aria-label="A cartoon Docker-style blue whale carrying a stack of shipping containers">
                <!-- body (rounded, chunky, facing left) -->
                <path class="whale-body" d="M 40 135
                         C 40 108, 68 92, 100 90
                         C 160 86, 230 90, 300 100
                         C 320 103, 335 110, 340 122
                         C 336 138, 320 150, 300 154
                         C 240 168, 150 180, 100 172
                         C 66 167, 40 158, 40 135 Z" />

                <!-- tail flukes (right side) -->
                <path class="whale-body" d="M 330 118 C 348 104, 366 92, 380 96 C 372 108, 356 120, 340 126 Z" />
                <path class="whale-body" d="M 336 126 C 352 138, 366 152, 378 168 C 360 164, 344 152, 332 138 Z" />

                <!-- pectoral fin -->
                <path class="whale-fin" d="M 118 150 C 116 168, 126 182, 145 188 C 140 172, 138 160, 142 150 Z" />

                <!-- spout (above the head, left) -->
                <g class="spout">
                    <circle cx="92" cy="40" r="4" />
                    <circle cx="99" cy="28" r="3" />
                    <circle cx="85" cy="30" r="2.5" />
                    <path d="M 92 88 C 86 76, 86 62, 92 56 C 98 62, 98 76, 92 88 Z" />
                </g>

                <!-- eye (on the head, left) -->
                <circle class="whale-eye-white" cx="72" cy="118" r="8" />
                <circle class="whale-eye" cx="70" cy="119" r="3.5" />

                <!-- smile (optional — not in the official mark; keep for a friendly tone) -->
                <path class="whale-smile" d="M 46 138 Q 60 149 80 140" />

                <!-- containers on the back: blue skyline, varying heights -->
                <g class="containers">
                    <rect class="container c-1" x="112" y="62" width="28" height="30" rx="1" />
                    <rect class="container c-2" x="142" y="48" width="28" height="44" rx="1" />
                    <rect class="container c-3" x="172" y="58" width="28" height="34" rx="1" />
                    <rect class="container c-4" x="202" y="44" width="28" height="48" rx="1" />
                    <rect class="container c-5" x="232" y="62" width="28" height="30" rx="1" />
                    <rect class="container c-6" x="262" y="66" width="28" height="26" rx="1" />
                </g>
            </svg>

            <div class="waves">
                <svg viewBox="0 0 500 40" preserveAspectRatio="none" class="wave wave-back">
                    <path d="M0 20 Q 25 0 50 20 T 100 20 T 150 20 T 200 20 T 250 20 T 300 20 T 350 20 T 400 20 T 450 20 T 500 20 V40 H0 Z"/>
                </svg>
                <svg viewBox="0 0 500 40" preserveAspectRatio="none" class="wave wave-front">
                    <path d="M0 25 Q 25 5 50 25 T 100 25 T 150 25 T 200 25 T 250 25 T 300 25 T 350 25 T 400 25 T 450 25 T 500 25 V40 H0 Z"/>
                </svg>
            </div>
        </div>

        <a class="cta" href="https://www.docker.com" target="_blank" rel="noopener noreferrer">Get Started</a>
    </main>

    <footer class="footer">
        <p>Built with Python &amp; Flask &mdash; happy shipping! &#128051;</p>
    </footer>
</body>
</html>
